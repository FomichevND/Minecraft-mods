plugins { id 'fabric-loom' version '1.6.12' }
version = '1.12.1'
group = 'ru.zoldrax'
base { archivesName = 'zoldrax-monument' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.15.11'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }

sourceSets {
 gametest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
loom {
 mods {
  zoldrax { sourceSet sourceSets.main }
  zoldrax_test { sourceSet sourceSets.gametest }
 }
 runs {
  lightingPreview {
   client()
   source sourceSets.gametest
   vmArg "-Dzoldrax.lightingPreview=true"
   runDir "build/monkey-client"
   programArgs "--quickPlaySingleplayer", "MonkeyDecorReview", "--width", "1280", "--height", "900"
  }
  monkeyPreview {
   client()
   source sourceSets.gametest
   vmArg "-Dzoldrax.monkeyPreview=true"
   vmArg "-Dzoldrax.monkeyPrepOnly=${project.hasProperty('monkeyPrepOnly')}"
   vmArg "-Dzoldrax.monkeyBoardOnly=${project.hasProperty('monkeyBoardOnly')}"
   runDir "build/monkey-client"
   programArgs "--quickPlaySingleplayer", "MonkeyDecorReview", "--width", "1280", "--height", "900"
  }
  decorPreview {
   client()
   source sourceSets.gametest
   vmArg "-Dzoldrax.decorPreview=true"
   vmArg "-Dzoldrax.decorIconOnly=${project.hasProperty('decorIconOnly')}"
   runDir "build/decor-client"
   programArgs "--quickPlaySingleplayer", "DecorReview", "--width", "1280", "--height", "900"
  }
  gametest {
   server()
   name 'Construction integration tests'
   source sourceSets.gametest
   vmArg '-Dfabric-api.gametest'
   vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-results.xml"
   runDir 'build/gametest'
   programArg '--world'
   programArg "isolated-test-${System.currentTimeMillis()}"
  }
 }
}

// Test subsets operate on parsed metadata, preserving valid JSON entrypoint arrays.
tasks.named('processGametestResources') {
 inputs.property('skipFrequency', project.hasProperty('skipFrequency'))
 inputs.property('decorOnly', project.hasProperty('decorOnly'))
 doLast {
  def target = file("${destinationDir}/fabric.mod.json")
  def metadata = new groovy.json.JsonSlurper().parse(file('src/gametest/resources/fabric.mod.json'))
  if (project.hasProperty('skipFrequency')) metadata.entrypoints['fabric-gametest'].removeAll { it.endsWith('MonkeyGenerationTests') }
  if (project.hasProperty('decorOnly')) metadata.entrypoints['fabric-gametest'].removeAll { !(it.endsWith('DecorTests') || it.endsWith('MonkeyFoodCatalogTests')) }
  target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)), 'UTF-8')
 }
}
