plugins { id 'fabric-loom' version '1.6.12' }
version = '1.11.0'
group = 'ru.zoldrax'
base { archivesName = 'zoldrax-monument' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.15.11'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }

sourceSets {
 gametest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
loom {
 mods {
  zoldrax { sourceSet sourceSets.main }
  zoldrax_test { sourceSet sourceSets.gametest }
 }
 runs {
  decorPreview {
   client()
   source sourceSets.gametest
   vmArg "-Dzoldrax.decorPreview=true"
   vmArg "-Dzoldrax.decorIconOnly=${project.hasProperty('decorIconOnly')}"
   runDir "build/decor-client"
   programArgs "--quickPlaySingleplayer", "DecorReview", "--width", "1280", "--height", "900"
  }
  gametest {
   server()
   name 'Construction integration tests'
   source sourceSets.gametest
   vmArg '-Dfabric-api.gametest'
   vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-results.xml"
   runDir 'build/gametest'
   programArg '--world'
   programArg "isolated-test-${System.currentTimeMillis()}"
  }
 }
}

// Keep the earlier exhaustive terrain frequency benchmark available separately.
tasks.named('processGametestResources') {
 inputs.property('skipFrequency', project.hasProperty('skipFrequency'))
 inputs.property('decorOnly', project.hasProperty('decorOnly'))
 filesMatching('fabric.mod.json') {
  filter { line -> (project.hasProperty('skipFrequency') && line.contains('ru.zoldrax.MonkeyGenerationTests')) || (project.hasProperty('decorOnly') && line.contains('ru.zoldrax.') && !line.contains('DecorTests') && !line.contains('DecorClientPreview')) ? null : line }
 }
}
